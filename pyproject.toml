[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hanimetv"
version = "2.0.0"
description = "Python client for the public hanime.tv API (v2)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Moe Poi", email = "moepoi@protonmail.com" }]
keywords = ["hanime", "hanime.tv", "api", "scraper"]
dependencies = ["requests>=2.25"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://github.com/moepoi/HanimeTV"

[tool.setuptools]
packages = ["HTV"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "pytest-cache-files-*",
    ".git",
    "__pycache__",
    "*.egg-info",
]
addopts = "-ra -p no:cacheprovider"
