[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hanimetv"
version = "2.1.0"
description = "Python client for hanime.tv: catalog metadata plus browser-backed downloads"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Moe Poi", email = "moepoi@protonmail.com" }]
keywords = ["hanime", "hanime.tv", "api", "scraper", "download"]
dependencies = ["requests>=2.25"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]

[project.optional-dependencies]
# Login and downloads go through a real browser: hanime.tv signs those
# requests inside its own WebAssembly module.
browser = ["playwright>=1.40"]

[project.scripts]
htv = "HTV.cli:main"

[project.urls]
Homepage = "https://github.com/moepoi/HanimeTV"

[tool.setuptools]
packages = ["HTV"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "pytest-cache-files-*",
    ".git",
    "__pycache__",
    "*.egg-info",
]
addopts = "-ra -p no:cacheprovider"
markers = [
    "browser: needs Playwright and a Chromium build (set HTV_BROWSER_TESTS=1)",
]
